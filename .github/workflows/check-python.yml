name: Check Python code

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'ruff.toml'
      - 'mypy.ini'
      - 'pytest.ini'
      - '.github/workflows/check-python.yml'
  push:
    branches:
      - 'main'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'ruff.toml'
      - 'mypy.ini'
      - 'pytest.ini'
      - '.github/workflows/check-python.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --locked
      - name: Run ruff check
        run: uv run ruff check
      - name: Run ruff format check
        run: uv run ruff format --check

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --locked
      - name: Run mypy
        run: uv run mypy src tests scripts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --locked
      - name: Run pytest
        run: uv run pytest
