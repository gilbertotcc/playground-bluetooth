name: Update Bluetooth SIG assigned numbers

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Requires "Allow GitHub Actions to create and approve pull requests" in the repository settings
# (Settings > Actions > General > Workflow permissions).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  BRANCH: automation/update-assigned-numbers
  DATA_DIR: src/playground_bluetooth/infrastructure/assigned_numbers/data

jobs:
  update:
    name: Update assigned numbers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Update vendored assigned numbers
        run: uv run scripts/update_assigned_numbers.py
      - name: Detect changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- "$DATA_DIR")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pull requests opened with GITHUB_TOKEN don't trigger the CI workflows, so test before opening one.
      - name: Install project dependencies
        if: steps.changes.outputs.changed == 'true'
        run: uv sync --locked
      - name: Run pytest
        if: steps.changes.outputs.changed == 'true'
        run: uv run pytest
      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add -- "$DATA_DIR"
          git commit --message "Update Bluetooth SIG assigned numbers"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "Update Bluetooth SIG assigned numbers" \
              --body "Automated refresh of the vendored YAML files from the [Bluetooth SIG – Assigned Numbers YAML repository](https://bitbucket.org/bluetooth-SIG/public/src/main/assigned_numbers/), made by \`scripts/update_assigned_numbers.py\`. Tests passed in the workflow run; CI does not run automatically on this pull request."
          fi
