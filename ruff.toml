src = ["src"]
line-length = 120
target-version = "py314"

[lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N", # pep8-naming
    "SIM", # flake8-simplify
    "PERF", # performance
    "RUF", # ruff-specific rules
    "S", # bandit
    "FBT", # boolean-trap
    "TCH", # typing-only imports
    "TID", # tidy imports (layering, see banned-api)
    "FURB", # refurb
]

[lint.isort]
lines-after-imports = 2

[lint.flake8-tidy-imports.banned-api]
# Layering: the domain (`playground_bluetooth.models`) must not depend on the implementation libraries.
# Rule TID251 (flake8-tidy-imports banned-api, enabled by "TID" in `select`) reports any import of the modules
# listed here, including their submodules (e.g. `from bleak.backends.device import BLEDevice`).
# TID251 is turned off in `per-file-ignores` only where these libraries are allowed: the
# `playground_bluetooth.infrastructure` package, its tests and the maintenance scripts.
"bleak".msg = "Use bleak only in playground_bluetooth.infrastructure"
"yaml".msg = "Use yaml only in playground_bluetooth.infrastructure"

[lint.per-file-ignores]
# Where bleak and yaml may be imported (see `[lint.flake8-tidy-imports.banned-api]`).
"src/playground_bluetooth/infrastructure/**/*" = ["TID251"]
"tests/infrastructure/**/*" = ["TID251"]
"scripts/**/*" = ["TID251"]
"tests/**/*" = [
    "S101", # allow `assert` in tests
    "S108", # allow hardcoded temp paths in tests
    "E501", # allow long lines in tests
    "FBT001", # allow boolean args in functions in tests
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
skip-magic-trailing-comma = false
